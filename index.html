<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"/><title>SDF Soft Shadow Lab</title><link rel="stylesheet" href="styles.css"/></head>
<body>
<main>
  <canvas id="c" width="900" height="700"></canvas>
  <section class="panel">
    <h1>SDF Soft Shadow</h1>
    <div id="status">boot</div>
    <label>softness k <input id="k" type="range" min="1" max="64" value="16"/></label>

    <button id="capture">Capture PNG</button>
    <pre id="stats"></pre>
  </section>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
